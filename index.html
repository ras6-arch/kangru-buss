<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kangru buss</title><meta name="theme-color" content="#7450b8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Kangru buss"><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172033;background:#f5f4f9;--purple:#7450b8;--home:#19b8b0;--yellow:#f4c542}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px}.top{display:flex;justify-content:space-between;align-items:end;margin:8px 2px 18px}.top h1{margin:0;font-size:28px}.today{font-size:13px;color:#64748b;text-align:right}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e7edf5;padding:5px;border-radius:18px;margin-bottom:14px}.tab{border:0;background:transparent;padding:13px;border-radius:14px;font-weight:900;font-size:16px;color:#526174}.tab[data-dir=city].active{background:var(--purple);color:white}.tab[data-dir=home].active{background:var(--home);color:white}.panel{background:white;border-radius:18px;padding:14px;margin-bottom:12px}.city{background:#f3edff}.city small,.when small{display:block;color:#786595;margin-bottom:9px;font-weight:800}.city-select{width:100%;border:2px solid #d8c9f3;background:#fff;color:#6843a8;border-radius:13px;padding:12px;font:inherit;font-weight:850}.when{background:#fbfaf7}.seg{display:grid;grid-template-columns:1fr 1fr;background:#f1efe9;padding:4px;border-radius:13px;margin-top:10px}.seg button{border:0;background:transparent;border-radius:10px;padding:9px;font-weight:850}.seg button.active{background:var(--yellow)}.custom{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.custom.show{display:grid}.custom select,.custom input{width:100%;padding:10px;border:1px solid #ddd;border-radius:11px}.hint{font-size:13px;color:#64748b;margin:0 4px 14px}.list{display:grid;gap:11px}.ride{background:white;border-radius:20px;padding:16px;display:grid;grid-template-columns:118px 1fr auto;gap:12px;align-items:center}.mins{font-size:31px;font-weight:900;line-height:1}.mins span{font-size:12px;display:block;font-weight:700;color:#718096;margin-top:5px}.mins .hour-unit{display:inline;margin:0 3px 0 2px}.route{font-size:20px;font-weight:900}.meta{font-size:13px;color:#718096;margin-top:4px}.time{font-size:20px;font-weight:850}.foot{font-size:12px;color:#8491a3;text-align:center;padding:20px 4px}</style></head><body><main class="app"><div class="top"><h1>Minu buss</h1><div class="today" id="today"></div></div><div class="tabs"><button class="tab active" data-dir="city">LINNA</button><button class="tab" data-dir="home">KOJU</button></div><div class="panel city"><small>Linnapeatus</small><select class="city-select" id="cityStop"><option>Viru</option><option>Kosmos</option><option>Kalev</option><option>Viljandi mnt</option></select></div><div class="panel when"><small>Millal?</small><strong id="whenLabel">Praegu</strong><div class="seg"><button id="nowBtn" class="active">Praegu</button><button id="otherBtn">Muu aeg</button></div><div class="custom" id="custom"><select id="day"></select><input id="clock" type="time" value="18:00"></div></div><p class="hint" id="hint"></p><section class="list" id="list"></section><div class="foot">Harjumaa bussid 116, 116A, 116B ja 116C · prototüüp</div></main><script>
const cityOffsets={Viru:0,Kosmos:3,Kalev:7,'Viljandi mnt':11};const times={'116':['05:10','05:50','06:20','07:00','08:10','08:42','10:40','11:50','12:57','14:00','15:20','16:25','18:05','18:20','19:52','21:32','23:40'],'116A':['06:38','14:55','17:30'],'116B':['06:10','07:40','09:50','11:15','12:35','13:42','14:40','16:05','17:10','18:40','20:40','22:30'],'116C':['07:15','09:20','13:20','14:20','15:45','16:50','17:45','19:10']};const stops={'116':'Kangru','116A':'Kangru','116B':'Põdra tee','116C':'Kangru'};let dir='city',mode='now',cityStop='Viru';const list=document.querySelector('#list'),day=document.querySelector('#day'),clock=document.querySelector('#clock');function addMin(t,m){let [h,n]=t.split(':').map(Number),z=h*60+n+m;return String(Math.floor(z/60)%24).padStart(2,'0')+':'+String(z%60).padStart(2,'0')}function fillDays(){for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()+i);day.add(new Option(i===0?'Täna':i===1?'Homme':d.toLocaleDateString('et-EE',{weekday:'long'}),i))}}function base(){let d=new Date();if(mode==='custom'){d.setDate(d.getDate()+Number(day.value));let [h,m]=clock.value.split(':').map(Number);d.setHours(h,m,0,0)}return d}function after(min){if(min<60)return min+'<span>min pärast</span>';let h=Math.floor(min/60);return h+'<span class="hour-unit">h</span>'+(min%60)+'<span>min pärast</span>'}function render(){let b=base(),now=new Date(),rows=[];Object.entries(times).forEach(([line,ts])=>ts.forEach(t=>{let shown=dir==='home'?addMin(t,cityOffsets[cityStop]):t;let d=new Date(b);let [h,m]=shown.split(':').map(Number);d.setHours(h,m,0,0);if(d>=b)rows.push({line,time:shown,stop:stops[line],d})}));rows.sort((a,b)=>a.d-b.d);list.innerHTML=rows.slice(0,6).map(r=>`<article class="ride"><div class="mins">${after(Math.max(0,Math.ceil((r.d-now)/60000)))}</div><div><div class="route">${r.line} → ${dir==='city'?cityStop:'koju'}</div><div class="meta">${dir==='city'?r.stop:cityStop+' · '+r.stop}</div></div><div class="time">${r.time}</div></article>`).join('')||'<article class="ride" style="display:block">Selle aja järel väljumisi ei leitud.</article>';document.querySelector('#hint').textContent=dir==='city'?'Kangru ja Põdra tee väljumised koos.':cityStop+' → Kangru / Põdra tee';document.querySelector('#custom').classList.toggle('show',mode==='custom');document.querySelector('#nowBtn').classList.toggle('active',mode==='now');document.querySelector('#otherBtn').classList.toggle('active',mode==='custom')}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{dir=x.dataset.dir;document.querySelectorAll('.tab').forEach(y=>y.classList.toggle('active',y===x));if(dir==='home'){cityStop='Viru';document.querySelector('#cityStop').value='Viru'}render()});document.querySelector('#cityStop').onchange=e=>{cityStop=e.target.value;render()};document.querySelector('#nowBtn').onclick=()=>{mode='now';render()};document.querySelector('#otherBtn').onclick=()=>{mode='custom';render()};day.onchange=clock.onchange=render;fillDays();document.querySelector('#today').textContent=new Date().toLocaleDateString('et-EE',{weekday:'long',day:'numeric',month:'long'});render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));</script></body></html>
