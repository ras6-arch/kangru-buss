<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kangru buss</title><meta name="theme-color" content="#7450b8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Kangru buss"><link rel="manifest" href="manifest.webmanifest">
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f4f9;--purple:#7450b8;--purple-soft:#f3edff;--home:#19b8b0;--home-soft:#e6f8f7;--yellow:#f4c542;--yellow-soft:#fffdf5}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px}.top{display:flex;justify-content:space-between;align-items:end;margin:8px 2px 18px}.top h1{margin:0;font-size:28px}.today{font-size:13px;color:#64748b;text-align:right}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e7edf5;padding:5px;border-radius:18px;margin-bottom:14px}.tab{border:0;background:transparent;padding:13px;border-radius:14px;font-weight:900;font-size:16px;color:#526174}.tab.active{background:var(--purple);color:white;box-shadow:0 3px 10px #7450b833}.panel{background:white;border-radius:18px;padding:14px;margin-bottom:12px}.city{display:block;border:0;background:var(--purple-soft)}.city small{display:block;color:#786595;margin-bottom:9px;font-weight:800}.city-select{width:100%;border:2px solid #d8c9f3;background:#fff;color:#6843a8;border-radius:13px;padding:12px 42px 12px 13px;font:inherit;font-size:16px;font-weight:850;box-shadow:0 2px 5px #3d256512;cursor:pointer;appearance:auto}.when small{display:block;color:#6f6f6f;margin-bottom:3px;font-weight:700}select,input{font:inherit}.when{border:0;background:#fbfaf7}.when-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.seg{display:grid;grid-template-columns:1fr 1fr;background:#f1efe9;padding:4px;border-radius:13px}.seg button{border:0;background:transparent;border-radius:10px;padding:9px 12px;font-weight:850;color:#687386}.seg button.active{background:var(--yellow);color:#3a3200}.custom{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.custom.show{display:grid}.custom label{font-size:12px;color:#64748b;font-weight:750}.custom select,.custom input{width:100%;margin-top:4px;border:1px solid #ddd7c7;background:white;border-radius:11px;padding:10px;color:#172033;font-weight:750}.hint{font-size:13px;color:#64748b;margin:0 4px 14px}.list{display:grid;gap:11px}.ride{background:white;border-radius:20px;padding:16px;display:grid;grid-template-columns:118px 1fr auto;gap:12px;align-items:center;box-shadow:0 4px 18px #1e293b0c}.mins{font-size:31px;font-weight:900;line-height:1;color:#172033}.mins span{font-size:12px;display:block;font-weight:700;color:#718096;margin-top:5px}.mins .hour-unit{display:inline;font-size:12px;margin:0 3px 0 2px;vertical-align:baseline}.route{font-size:20px;font-weight:900}.meta{font-size:13px;color:#718096;margin-top:4px}.time{font-size:20px;font-weight:850;text-align:right}.arrival{font-size:13px;color:#718096;margin-top:4px;font-weight:700}.foot{font-size:12px;color:#8491a3;text-align:center;padding:20px 4px}@media(max-width:390px){.ride{grid-template-columns:105px 1fr auto;gap:8px}.mins{font-size:25px}.route{font-size:18px}}
</style></head><body><main class="app">
<div class="top"><h1>Minu buss</h1><div class="today" id="today"></div></div>
<div class="tabs"><button class="tab active" data-dir="city">LINNA</button><button class="tab" data-dir="home">KOJU</button></div>
<div class="panel city"><div class="city-title"><small>Linnapeatus</small></div><select class="city-select" id="cityStop"><option value="Viru" selected>Viru</option><option value="Kosmos">Kosmos</option><option value="Kalev">Kalev</option><option value="Hallivanamehe">Hallivanamehe</option><option value="Viljandi maantee">Viljandi mnt</option></select></div>
<div class="panel when"><div class="when-head"><div><small>Millal?</small></div></div><div class="seg"><button id="nowBtn" class="active">Praegu</button><button id="otherBtn">Muu aeg</button></div><div class="custom" id="custom"><label>Päev<select id="day"></select></label><label>Kell<input id="clock" type="time" value="18:00"></label></div></div>
<p class="hint" id="hint"></p><section class="list" id="list"></section>
<div class="foot">Sõiduplaan: ametlik Harjumaa GTFS.</div></main>
<script>
let DATA=[],dir='city',mode='now',cityStop='Viru';
const list=document.querySelector('#list'),day=document.querySelector('#day'),clock=document.querySelector('#clock'),cityStopSelect=document.querySelector('#cityStop');
const wd=['P','E','T','K','N','R','L'],names=['Pühapäev','Esmaspäev','Teisipäev','Kolmapäev','Neljapäev','Reede','Laupäev'];
function localDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function departureDate(r){const [y,mo,d]=r.date.split('-').map(Number),[h,m]=r.departure.split(':').map(Number);return new Date(y,mo-1,d,h,m,0,0)}
function fillDays(){day.innerHTML='';let n=new Date();for(let i=0;i<7;i++){let d=new Date(n);d.setDate(n.getDate()+i);let label=i===0?'Täna':i===1?'Homme':names[d.getDay()];day.add(new Option(`${label} · ${wd[d.getDay()]}`,i));}}
function baseDate(){let d=new Date();if(mode==='custom'){d.setDate(d.getDate()+Number(day.value));let [h,m]=clock.value.split(':').map(Number);d.setHours(h,m,0,0)}else d.setSeconds(0,0);return d}
function afterText(totalMin){totalMin=Math.max(0,totalMin);if(totalMin<60)return `${totalMin}<span>min pärast</span>`;let h=Math.floor(totalMin/60),m=totalMin%60;return `${h}<span class="hour-unit">h</span>${m}<span>min pärast</span>`}
function render(){
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.dir===dir));
 cityStopSelect.value=cityStop;
 document.querySelector('#custom').classList.toggle('show',mode==='custom');
 document.querySelector('#nowBtn').classList.toggle('active',mode==='now');
 document.querySelector('#otherBtn').classList.toggle('active',mode==='custom');
 const now=new Date(),b=baseDate(),date=localDate(b);
 let rows=DATA.filter(r=>r.direction===dir);
 if(mode==='custom')rows=rows.filter(r=>r.date===date);
 rows=dir==='city'?rows.filter(r=>r.destination===cityStop):rows.filter(r=>r.origin===cityStop);
 rows=rows.map(r=>({...r,dep:departureDate(r)})).filter(r=>Number.isFinite(r.dep.getTime())&&r.dep>=b).sort((a,z)=>a.dep-z.dep).slice(0,6);
 document.querySelector('#hint').textContent=mode==='now'?'Näitan järgmisi väljumisi praegusest kellaajast alates.':(dir==='city'?'Kangru ja Põdra tee väljumised koos.':`${cityStop} → Kangru / Põdra tee. Viru on alati vaikimisi.`);
 if(!rows.length){list.innerHTML='<article class="ride" style="display:block"><strong>Selle aja järel rohkem väljumisi ei leitud.</strong><div class="meta">Vali „Muu aeg“, et vaadata teist päeva või kellaaega.</div></article>';return}
 list.innerHTML=rows.map(r=>`<article class="ride"><div class="mins">${afterText(Math.ceil((r.dep-now)/60000))}</div><div><div class="route">${r.line} → ${dir==='city'?cityStop:'koju'}</div><div class="meta">${dir==='city'?r.origin:r.origin+' · '+r.destination}</div></div><div class="time">${r.departure}<div class="arrival">saabumisaeg ${r.arrival}</div></div></article>`).join('');
}
async function loadData(){const r=await fetch('./timetable.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('timetable');const x=await r.json();DATA=x.entries||[];}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{dir=b.dataset.dir;if(dir==='home')cityStop='Viru';render()});
cityStopSelect.onchange=()=>{cityStop=cityStopSelect.value;render()};
document.querySelector('#nowBtn').onclick=async()=>{mode='now';try{await loadData()}catch(e){}render()};
document.querySelector('#otherBtn').onclick=()=>{mode='custom';render()};
day.onchange=render;clock.onchange=render;fillDays();
document.querySelector('#today').textContent=new Intl.DateTimeFormat('et-EE',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
loadData().then(render).catch(()=>{list.innerHTML='<article class="ride" style="display:block"><strong>Sõiduplaani laadimine ebaõnnestus.</strong><div class="meta">Proovi lehte uuendada.</div></article>'});
if('serviceWorker' in navigator){addEventListener('load',async()=>{const reg=await navigator.serviceWorker.register('./service-worker.js?v=6',{updateViaCache:'none'});reg.update()})}
</script></body></html>
