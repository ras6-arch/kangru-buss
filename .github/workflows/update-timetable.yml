name: Update official bus timetable

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    paths:
      - 'scripts/build_gtfs.py'
      - '.github/workflows/update-timetable.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build timetable from official Harjumaa GTFS
        run: python scripts/build_gtfs.py
      - name: Commit timetable if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timetable.json
          git diff --cached --quiet || git commit -m "Update official timetable"
          git push
